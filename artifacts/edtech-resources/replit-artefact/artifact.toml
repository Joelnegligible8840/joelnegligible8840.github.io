kind = "web"
previewPath = "/"
title = "Інформатика та ШІ — Збірник ресурсів"
version = "1.0.0"
id = "artifacts/edtech-resources"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22480

[services.development]
run = "pnpm --filter @workspace/edtech-resources run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edtech-resources", "run", "build" ]
serve = "static"
publicDir = "artifacts/edtech-resources/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22480"
BASE_PATH = "/"
